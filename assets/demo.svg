<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="14">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <style>
      .l{opacity:0;animation:in .35s ease forwards}
      @keyframes in{to{opacity:1}}
      .d{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35}}
      .c{fill:#c9d1d9}.h{fill:#8b949e;font-weight:bold}.g{fill:#3fb950}.p{fill:#a371f7}.y{fill:#d29922}
    </style>
  </defs>
  <rect width="720" height="330" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="360" y="25" text-anchor="middle" fill="#8b949e" font-size="12">chainpulse — zsh</text>
  <text x="24" y="70" class="l c" style="animation-delay:.2s"><tspan class="p">❯</tspan> chainpulse</text>
  <g class="l" style="animation-delay:.9s"><text x="48" y="110" class="h">Network</text><text x="190" y="110" class="h">Chain ID</text><text x="300" y="110" class="h">Block</text><text x="450" y="110" class="h">Latency</text></g>
  <g class="l" style="animation-delay:1.3s"><circle class="d" cx="30" cy="136" r="5" fill="#3fb950"/><text x="48" y="141" class="c">Base</text><text x="190" y="141" class="c">8453</text><text x="300" y="141" class="c">52,978,387</text><text x="450" y="141" class="g">168 ms</text></g>
  <g class="l" style="animation-delay:1.5s"><circle class="d" cx="30" cy="164" r="5" fill="#3fb950"/><text x="48" y="169" class="c">Ethereum</text><text x="190" y="169" class="c">1</text><text x="300" y="169" class="c">26,254,298</text><text x="450" y="169" class="g">173 ms</text></g>
  <g class="l" style="animation-delay:1.7s"><circle class="d" cx="30" cy="192" r="5" fill="#3fb950"/><text x="48" y="197" class="c">Arbitrum</text><text x="190" y="197" class="c">42161</text><text x="300" y="197" class="c">517,489,211</text><text x="450" y="197" class="g">176 ms</text></g>
  <g class="l" style="animation-delay:1.9s"><circle class="d" cx="30" cy="220" r="5" fill="#3fb950"/><text x="48" y="225" class="c">Polygon</text><text x="190" y="225" class="c">137</text><text x="300" y="225" class="c">96,027,168</text><text x="450" y="225" class="g">187 ms</text></g>
  <g class="l" style="animation-delay:2.1s"><circle class="d" cx="30" cy="248" r="5" fill="#3fb950"/><text x="48" y="253" class="c">BNB Chain</text><text x="190" y="253" class="c">56</text><text x="300" y="253" class="c">129,294,407</text><text x="450" y="253" class="y">297 ms</text></g>
  <text x="24" y="295" class="l g" style="animation-delay:2.5s">✔ 5/5 endpoints healthy</text>
</svg>
